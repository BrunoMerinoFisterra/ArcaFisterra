services:
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: /api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      REPOSITORIO: sqlite
      SQLITE_PATH: /data/arca.db
      SEMBRAR_DEMO: 0
      ORIGEN_PERMITIDO: ${PUBLIC_ORIGIN:-http://localhost}
    volumes:
      - arca_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    env_file: .env.production
    environment:
      NODE_ENV: production
      REPOSITORIO: sqlite
      SQLITE_PATH: /data/arca.db
      ARCA_API_DIR: /app/arca-api
      WORKER_HEADED: 0
    volumes:
      - arca_data:/data
      - worker_sessions:/app/arca-worker/.sessions
      - worker_artifacts:/app/arca-worker/.artifacts
    shm_size: 1gb
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arca_data:
  worker_sessions:
  worker_artifacts:
  caddy_data:
  caddy_config:

